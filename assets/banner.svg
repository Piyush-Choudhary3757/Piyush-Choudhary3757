<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#050a14"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E75B6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- Soft accent wave -->
  <path d="M0,190 C220,140 420,235 600,190 C780,145 980,235 1200,190 L1200,260 L0,260 Z"
        fill="url(#accent)" opacity="0.18"/>

  <path d="M0,205 C260,165 420,235 600,205 C780,175 960,235 1200,205"
        fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.65"/>

  <!-- Title -->
  <text x="600" y="112" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="54" font-weight="800"
        fill="#E6F1FF" filter="url(#glow)">
    Piyush Choudhary
  </text>

  <!-- Subtitle (IMPORTANT: use &amp; not &) -->
  <text x="600" y="160" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="20" font-weight="500"
        fill="#B8C7E0">
    Data Analyst (Water/Wastewater Ops) • Data Science • Python | SQL | Power BI • LLMs &amp; Agentic AI
  </text>
</svg>
