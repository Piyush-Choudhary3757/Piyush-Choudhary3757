name: Update Dev.to posts
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "DEVTO"
          feed_list: "https://dev.to/feed/YOUR_DEVTO_USERNAME"
          max_post_count: 5
          template: "$newline- [$title]($url)"
